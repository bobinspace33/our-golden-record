<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Konsult</title>
  <!-- Early fetch — large MP3 so playback can align with blackout reveal -->
  <link rel="preload" fetchpriority="high" href="music/Deep%20Space%20Vapor%20-%20Optimalystic/1%20-%20The%20Deep.mp3" as="audio" type="audio/mpeg" />
  <link rel="preload" href="backgrounds/composite1.png" as="image" />
  <audio
    id="splashMusic"
    class="splash-music-audio"
    preload="auto"
    playsinline
    aria-hidden="true"
  >
    <source src="music/Deep%20Space%20Vapor%20-%20Optimalystic/1%20-%20The%20Deep.mp3" type="audio/mpeg" />
  </audio>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="splash.css" />
</head>
<body class="splash-body">
  <a class="splash-skip" href="home.html">Skip to councils</a>

  <div class="splash-bg" aria-hidden="true">
    <div class="splash-bg-image">
      <div class="splash-bg-pan">
        <img
          class="splash-bg-photo"
          src="splash/background.jpg"
          alt=""
          decoding="async"
          fetchpriority="high"
        />
      </div>
    </div>
    <div class="splash-bg-edge-fade"></div>
    <div class="splash-bg-blackout"></div>
  </div>

  <div class="splash-music-credit" aria-hidden="true">
    <img src="music-credit.png" alt="" class="splash-music-credit-img" width="200" height="80" decoding="async" />
  </div>

  <main class="splash-main">
    <div class="splash-title-block">
      <h1 class="splash-title-line">
        <a href="home.html" class="splash-enter" aria-label="Konsult — open councils">
          <span class="splash-konsult-wrap">
            <span class="splash-konsult-letters" aria-hidden="true">
              <span class="splash-letter" data-i="0">K</span>
              <span class="splash-letter splash-letter--o" data-i="1">O</span>
              <span class="splash-letter" data-i="2">N</span>
              <span class="splash-letter" data-i="3">S</span>
              <span class="splash-letter" data-i="4">U</span>
              <span class="splash-letter" data-i="5">L</span>
              <span class="splash-letter" data-i="6">T</span>
            </span>
            <img
              class="splash-arrow"
              src="splash/blue-arrow.png"
              alt=""
              width="72"
              height="72"
              decoding="async"
            />
          </span>
        </a>
      </h1>
      <p class="splash-subtitle">Experiential learning assistant</p>
    </div>
  </main>

  <script src="splash.js" defer></script>
</body>
</html>
