<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PBL Council Creator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="creator.css" />
</head>
<body class="creator-body home-body">
  <div class="layout layout-wide">
    <header class="creator-header">
      <h1>PBL Council Creator</h1>
      <p class="tagline">Design a council of AI (and human) stakeholders for any project-based learning unit. Open an existing council or build a new one.</p>
    </header>
<br>
    <section class="home-section">
      <h2 class="home-section-title">Saved drafts</h2
      <ul class="project-list draft-list" id="draftList"></ul>
      <p class="home-empty home-draft-empty" id="draftEmpty" hidden>No drafts yet. Use Save draft on the create page.</p>
    </section>

    <section class="home-section">
      <h2 class="home-section-title">Your councils</h2>
      <ul class="project-list" id="projectList">
        <!-- filled by home.js -->
      </ul>
      <p class="home-empty" id="homeEmpty" hidden>No saved councils yet. Create one below.</p>
    </section>

    <section class="home-actions">
      <a href="/create.html" class="btn-launch-council home-create-btn">Create New Council</a>
    </section>
  </div>
  <script src="home.js"></script>
</body>
</html>
